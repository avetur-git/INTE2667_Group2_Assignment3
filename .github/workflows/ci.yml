# Secure code integration pipeline for the E-Voting Platform.
# Runs on every push and pull request to main so no change is merged
# without passing the security unit tests and static security checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs can only read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: EVotingPlatform

env:
  PYTHON_VERSION: "3.11"  # matches the Dockerfile base image

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: EVotingPlatform/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -v --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: EVotingPlatform/pytest-report.xml

  sast:
    name: Static analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Bandit
        run: pip install bandit==1.9.4
      - name: Bandit report (all severities)
        run: bandit -r app -f txt -o bandit-report.txt --exit-zero
      - name: Fail on medium or high severity findings
        run: bandit -r app -ll
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: EVotingPlatform/bandit-report.txt

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Fails the pipeline if any pinned dependency has a known vulnerability.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --desc -o pip-audit-report.txt
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: EVotingPlatform/pip-audit-report.txt

  frontend-js:
    name: Front-end JavaScript syntax
    runs-on: ubuntu-latest
    # One syntax error stops a whole <script> block, which the Python tests
    # cannot see (an error like this once left every staff panel empty).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline template scripts and static/js
        run: python scripts/check_js_syntax.py

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [tests, sast, dependency-audit, frontend-js]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t evoting-platform:ci .
