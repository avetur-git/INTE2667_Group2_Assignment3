services:
  web:
    build: .
    ports:
      - "9001:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change-me-before-real-use
      - JWT_SECRET_KEY=change-me-before-real-use
      - DATABASE_URL=sqlite:////app/data/evoting.db
      - PORT=5000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
