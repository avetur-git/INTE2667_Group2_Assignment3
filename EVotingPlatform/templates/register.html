{% extends "base.html" %}
{% block title %}Create account - E-Voting Platform{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center"><h4>Create voter account</h4></div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="mb-3"><label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" minlength="3" required></div>
                    <div class="mb-3"><label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required></div>
                    <div class="mb-3"><label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" minlength="6" required></div>
                    <div class="d-grid"><button type="submit" class="btn btn-success">Create account</button></div>
                </form>
                <p class="text-muted small mt-3 mb-0">After creating an account, enrol on the next page. An AEC officer approves new enrolments.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const f = new FormData(e.target);
        const result = await apiRequest('/auth/register', { method: 'POST', body: JSON.stringify(Object.fromEntries(f)) });
        saveLogin(result);
        window.location.href = '/dashboard';
    } catch (err) { showAlert(err.message, 'danger'); }
});
</script>
{% endblock %}
