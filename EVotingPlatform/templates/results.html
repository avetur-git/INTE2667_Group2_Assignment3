{% extends "base.html" %}
{% block title %}Results - E-Voting Platform{% endblock %}
{% block content %}
<h2>Election results</h2>
<div class="row g-3 mb-4">
    <div class="col-md-5"><select class="form-select" id="electionSelect"></select></div>
    <div class="col-md-2"><button class="btn btn-success" id="loadBtn">Show results</button></div>
</div>
<div id="results"></div>
{% endblock %}
{% block scripts %}
<script>
async function init() {
    const elections = (await apiRequest('/elections/')).elections;
    document.getElementById('electionSelect').innerHTML = elections.map(e =>
        `<option value="${e.id}">${esc(e.name)} - ${esc(e.status)}</option>`).join('');
}
document.getElementById('loadBtn').addEventListener('click', async () => {
    const out = document.getElementById('results');
    try {
        const r = await apiRequest('/results/' + document.getElementById('electionSelect').value);
        out.innerHTML = `<div class="card mb-4"><div class="card-header"><h5 class="mb-0">House of Representatives</h5></div>
            <table class="table mb-0"><thead><tr><th>Division</th><th>Winner</th><th>Party</th></tr></thead><tbody>` +
            r.house.map(h => `<tr><td>${esc(h.division.name)}</td><td>${esc(h.winner ? h.winner.name : 'No result')}</td><td>${esc(h.winner ? h.winner.party : '')}</td></tr>`).join('') +
            `</tbody></table></div>` +
            r.senate.map(s => `<div class="card mb-4"><div class="card-header"><h5 class="mb-0">Senate - ${esc(s.state)} (${s.seats} seats)</h5></div>
            <table class="table mb-0"><thead><tr><th>#</th><th>Senator</th><th>Party</th></tr></thead><tbody>` +
            s.elected.map((c, i) => `<tr><td>${i + 1}</td><td>${esc(c.name)}</td><td>${esc(c.party)}</td></tr>`).join('') +
            `</tbody></table></div>`).join('');
    } catch (err) { out.innerHTML = ''; showAlert(err.message, 'warning'); }
});
document.addEventListener('DOMContentLoaded', init);
</script>
{% endblock %}
