<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Voting Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; }
        .footer { background-color: #f8f9fa; padding: 20px 0; margin-top: auto; }
        body { display: flex; flex-direction: column; min-height: 100vh; }
        .container { flex: 1; }
        .card { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .pref-input { width: 70px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/">🗳️ E-Voting Platform</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item" id="nav-dashboard"><a class="nav-link" href="/dashboard">My Enrolment</a></li>
                    <li class="nav-item" id="nav-vote"><a class="nav-link" href="/vote">Vote</a></li>
                    <li class="nav-item" id="nav-staff"><a class="nav-link" href="/staff">Staff Portal</a></li>
                    <li class="nav-item"><a class="nav-link" href="/results">Results</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" id="nav-login"><a class="nav-link" href="/login">Login</a></li>
                    <li class="nav-item" id="nav-register"><a class="nav-link" href="/register">Create account</a></li>
                    <li class="nav-item" id="nav-logout"><a class="nav-link" href="#" onclick="logout()">Logout (<span id="nav-user"></span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alert-container"></div>
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <div class="container text-center">
            <span class="text-muted">Electronic Voting Platform - base build for assignment use. Not for real elections.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let authToken = localStorage.getItem('authToken');
        let currentRole = localStorage.getItem('role');
        let currentUsername = localStorage.getItem('username');
        const API_BASE = '/api';

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function saveLogin(result) {
            localStorage.setItem('authToken', result.access_token);
            localStorage.setItem('role', result.user.role);
            localStorage.setItem('username', result.user.username);
            authToken = result.access_token; currentRole = result.user.role; currentUsername = result.user.username;
        }

        function show(id, visible) {
            const el = document.getElementById(id);
            if (el) el.style.display = visible ? '' : 'none';
        }

        function updateNavbar() {
            const loggedIn = !!authToken;
            const isVoter = currentRole === 'voter';
            show('nav-login', !loggedIn); show('nav-register', !loggedIn); show('nav-logout', loggedIn);
            show('nav-dashboard', loggedIn && isVoter); show('nav-vote', loggedIn && isVoter);
            show('nav-staff', loggedIn && !isVoter);
            const u = document.getElementById('nav-user'); if (u) u.textContent = currentUsername || '';
        }

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `${esc(message)}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 6000);
        }

        async function apiRequest(url, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...(authToken && { 'Authorization': `Bearer ${authToken}` }) };
            const response = await fetch(API_BASE + url, { ...options, headers });
            const data = await response.json().catch(() => ({}));
            // A stored session the server no longer accepts (expired, or from an old
            // database): forget all of it - not just the token - and log in again
            if (response.status === 401 && authToken) { clearSession(); goToLogin('expired'); }
            if (!response.ok) throw new Error(data.error || 'Request failed');
            return data;
        }

        function clearSession() {
            localStorage.clear();
            authToken = null; currentRole = null; currentUsername = null;
            updateNavbar();
        }

        function goToLogin(reason) {
            if (window.location.pathname !== '/login') {
                window.location.href = '/login' + (reason ? '?reason=' + encodeURIComponent(reason) : '');
            }
        }

        function logout() {
            clearSession();
            window.location.href = '/';
        }

        function requireLogin() {
            if (!authToken) { window.location.href = '/login'; return false; }
            return true;
        }

        document.addEventListener('DOMContentLoaded', updateNavbar);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
