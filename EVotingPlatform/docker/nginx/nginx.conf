# REQ-07: reverse proxy in front of the Flask app.
#
# First layer of throttling inside our own deployment: per-client-IP request
# and connection limits that drop floods before they reach Python. The app adds
# tighter per-endpoint limits and audit logging (app/security/rate_limit.py).
# In production a cloud DDoS service, CDN and WAF sit in front of this
# (docs/REQ-07_DDOS.md).
#
# nginx limits here are deliberately looser than the app's, so normal bursts
# pass and the app's audited limit is the one a single client normally meets.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Polling stations put many voters behind one public address. List their
    # registered NAT ranges here so the per-IP voting zone does not throttle a
    # busy station; voters there are still limited per user by the app.
    geo $polling_network {
        default 0;
        # 203.0.113.0/24 1;
    }
    map $polling_network $voting_key {
        0 $binary_remote_addr;
        1 "";                       # empty key: not counted
    }

    # Request rates per client IP. 10 MB of state holds about 160,000 addresses.
    limit_req_zone $binary_remote_addr zone=per_ip:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m   rate=60r/m;
    limit_req_zone $voting_key         zone=voting:10m  rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level  warn;      # every throttled request is logged at warn
    limit_conn_log_level warn;

    # Slow-request (slowloris) protection and request size cap.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    client_max_body_size  64k;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time ua="$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 8080;

        limit_conn conn_per_ip 20;

        # The app trusts exactly one proxy (TRUSTED_PROXY_COUNT=1) and reads the
        # client address from this header. Overwrite it rather than append, so a
        # client cannot smuggle in an address of its own.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        error_page 429 = @too_many_requests;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api/auth/login {
            limit_req zone=login  burst=20 nodelay;
            limit_req zone=per_ip burst=40 nodelay;
            proxy_pass http://web:5000;
        }

        location /api/voting/ {
            limit_req zone=voting burst=30 nodelay;
            limit_req zone=per_ip burst=40 nodelay;
            proxy_pass http://web:5000;
        }

        location / {
            limit_req zone=per_ip burst=40 nodelay;
            proxy_pass http://web:5000;
        }

        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error": "Too many requests. Please wait and try again."}\n';
        }
    }
}
