# REQ-08: load balancer for the API replicas.
#
#   nginx (REQ-07 rate limits) --> haproxy :8081 --> web:5000, web2:5000
#
# Active health checks: every replica's /health is polled every 2 s. Two failed
# checks in a row (about 5 s) take it out of rotation; two passing checks bring
# it back. A request that cannot connect to a replica (killed, not yet marked
# down) is retried on the other one, so voters do not see the failure.
# In production the same role is played by the cloud load balancer's target
# group health checks in each region (docs/REQ-08_AVAILABILITY.md).

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 1s          # a dead replica is given up on quickly
    timeout client  30s
    timeout server  30s
    # REQ-09: 2 s, not 1 s. A replica busy with logins (bcrypt is deliberately
    # slow) must not be mistaken for a dead one.
    timeout check   2s
    # REQ-09: requests over a replica's maxconn wait here, up to this long.
    timeout queue   30s
    # Retry only when the connection itself failed (the default retry-on), so a
    # request is never sent twice. Each retry may go to a different replica.
    retries 2
    option redispatch 1

# Docker's internal DNS. Lets haproxy start, and keep running, while a replica
# container is stopped and its name does not resolve.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend api
    bind :8081
    default_backend replicas

backend replicas
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # No "on-marked-down shutdown-sessions": cutting connections when a replica
    # is marked down would also cut requests still waiting to be retried on the
    # healthy replica, failing votes that would otherwise succeed.
    # REQ-09: maxconn 4 = admission control. Each 1-CPU replica works on at most
    # 4 requests at once; the rest queue in haproxy instead of piling onto the
    # replica. Without it, a load test overloaded every replica, their /health
    # answers went past the check timeout, and haproxy took all of them out of
    # rotation (503 for everyone). Health checks do not count against maxconn.
    default-server check inter 2s fall 2 rise 2 maxconn 4 resolvers docker init-addr last,libc,none
    server web  web:5000
    # REQ-09: one slot per scaled-out web2 container (web2-1, web2-2, ...),
    # filled from Docker's DNS. Unused slots stay in maintenance, so adding
    # replicas needs no change here: docker compose up -d --scale web2=N
    server-template web2- 1-8 web2:5000
    # Which replica answered, for the failover demo.
    http-response set-header X-Served-By %[srv_name]

# Live status page (green = in rotation, red = removed): http://localhost:8404
# Published on the local machine only.
listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
